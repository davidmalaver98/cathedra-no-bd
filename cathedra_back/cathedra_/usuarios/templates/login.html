<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathedra — Ingresar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    .brand {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 0;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      margin-bottom: -1px;
      transition: all 0.2s;
    }

    .tab.active {
      color: #111;
      font-weight: 500;
      border-bottom-color: #111;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #111;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      padding: 6px 0;
      font-size: 14px;
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
      color: #111;
    }

    .field input:focus { border-bottom-color: #111; }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      color: #111;
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Cathedra</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab" onclick="switchTab('register', this)">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="tab-login">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label>Email *</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="field">
          <label>Password *</label>
          <input type="password" name="password" required>
        </div>
        <div class="row">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="tab-register">
      <form method="post" action="{% url 'registro' %}">
        {% csrf_token %}
        <div class="field">
          <label>Name *</label>
          <input type="text" name="first_name" required>
        </div>
        <div class="field">
          <label>Email *</label>
          <input type="email" name="email" required>
        </div>
        <div class="field">
          <label>Username *</label>
          <input type="text" name="username" required>
        </div>
        <div class="field">
          <label>Password *</label>
          <input type="password" name="password1" required>
        </div>
        <div class="field">
          <label>Confirm Password *</label>
          <input type="password" name="password2" required>
        </div>
        <button class="btn" type="submit" style="margin-top:8px;">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }
  </script>
</body>
</html>
